<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Poke-Nexus</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font import and application */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevents body scroll bars when iframe is full screen */
        }
        /* Styles to make the iframe container fill the entire viewport */
        .iframe-container {
            width: 100vw;
            height: 100vh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center">

    <!-- Iframe Container to hold the embedded website -->
    <div class="iframe-container">
        <!-- Iframe pointing to the requested URL -->
        <iframe src="https://vinesh.engineer/" title="Vinesh's personal website."></iframe>
    </div>

</body>
</html>
